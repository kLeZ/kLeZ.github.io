timezone: Europe/Rome
lang: it
locale: it_IT

# Lingue (_plugins/i18n.rb): la prima di default alla root, le altre sotto /<lingua>/.
# Ogni lingua ha il suo _data/locales/<lingua>.yml; i file tradotti stanno in
# _posts/<lingua>/ e _pages/<lingua>/, che ne danno lingua e prefisso dell'URL.
languages: ["it", "en"]
default_lang: "it"
# Lingue in cui jekyll-polyglot pubblicava una copia di ogni pagina: a quegli URL
# restano dei redirect verso l'originale o la traduzione. Una lingua aggiunta dopo
# non va messa qui.
i18n_legacy_languages: ["it", "en"]
title: Alessandro 'kLeZ' Accardo personal website
description: >-
  This is the personal website of an Italian developer once called 'kLeZ'.
baseurl: ""
url: https://klez.me
copyright: Copyright © Alessandro 'kLeZ' Accardo 2019
repo: https://github.com/kLeZ/kLeZ.github.io
build:
  server: https://github.com/kLeZ/kLeZ.github.io/actions/workflows/main.yaml
  status: https://github.com/kLeZ/kLeZ.github.io/actions/workflows/main.yaml/badge.svg?branch=master

twitter:
  username: kLeZhAcK
  card: summary

collections:
  - xp

comments:
  enabled: false
  type: staticman
  post_url: https://klez-commenter.herokuapp.com/v2/entry/kLeZ/kLeZ.github.io/master/comments/
  avatar_provider: gravatar

sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never

include:
  - _pages
  - .well-known

defaults:
  - scope:
      path: ""
    values:
      author:
        name: kLeZ
        twitter: kLeZhAcK
      header_background_url: /assets/img/home-bg.jpg
      lang: it
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      post: true

# Permalink dei post; quelli in _posts/<lingua>/ lo ricevono sotto /<lingua>/.
permalink: /:year/:month/:day/:title/

show_excerpts: true
excerpt_separator: "{% include more.html %}"

markdown: kramdown
markdown_ext: "markdown,mkdown,mkdn,mkd,md,draft"
highlighter: rouge
katex:
  js_path: "assets/katex"
  rendering_options:
    throw_error: true
    error_color: "#cc0000"

goat-counter:
  stats-url: https://klez.goatcounter.com
  count-url: https://klez.goatcounter.com/count
  script-url: https://gc.zgo.at/count.js
  code: klez
  production-url: klez.me

jekyll_tidy:
  compress_html: false
  # JSON, Atom and RSS, not HTML: htmlbeautifier would mangle them
  exclude:
    - search.json
    - _pages/feeds/*.xml

# Elenchi paginati, pagine dei tag e delle serie: _plugins/blog_archive.rb
pagination:
  per_page: 10
tag_path: /tag/
series_path: /serie/
related_posts: 3
# Voci per ciascun feed Atom (/feed.xml, /<lingua>/feed.xml) e RSS (/rss.xml, /<lingua>/rss.xml)
feed_posts_limit: 10

emoji:
  src: "/assets/img"

plugins:
  - jekyll-sitemap
  - jekyll-tidy
  - jekyll-katex
  - liquid_reading_time
  - liquid_pluralize
  - jekyll-seo-tag
  - jemoji
  - jekyll-postfiles

# Defaults. IF you want to change the exclude make sure you keep those sane defaults
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - blog-vector-icon-27.jpg
  - staticman.yml
  - LICENSE
  # Documentazione e istruzioni per chi lavora sul repo (persone e agenti)
  - README.md
  - CLAUDE.md
  - AGENTS.md
  - CONTEXT.md
  - AUTHORING.md
  - SPEC-AUDIT.md
  - ACCESS-FILES.md
  # Ambiente di sviluppo
  - docker-compose.yml
  - docker-compose.override.yml
  - Makefile
  # Frammenti letti da include_relative, non pagine
  - _pages/includes/
  - _pages/en/includes/
