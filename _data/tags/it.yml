# Tag dei post. La chiave è l'id scritto nel front matter (`tags: [linux, git]`):
# la forma slug dell'etichetta italiana al momento della creazione (minuscole, senza
# accenti, parole separate da "-"), che poi non cambia più. L'id non compare nel sito:
# etichetta e URL (/tag/<slug di name>/) vengono da questo file, e per le altre lingue
# da _data/tags/<lingua>.yml, dove ogni id deve avere la sua voce. Campi:
#   name         etichetta mostrata nel sito; il suo slug è l'URL della pagina del tag
#   description  testo breve mostrato nella pagina del tag (facoltativo)
#   theme        true per i temi, i filoni larghi del blog (solo in questo file)
# Regole per scegliere i tag: AUTHORING.md, "Tags".

