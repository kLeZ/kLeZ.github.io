# Lingue del sito (_plugins/i18n.rb, selettore nella navbar, blocco lingue dei post).
# I codici tecnici (URL, html lang, hreflang, og:locale) restano generici: it / en.
# La bandiera 'gb' (Union Jack) per l'inglese è una scelta estetica, coerente con
# l'inglese britannico delle traduzioni.
#   name    nome della lingua, nella lingua stessa
#   read    testo del link verso la versione in questa lingua, nella lingua stessa
#   home    testo del link alla home di questa lingua (pagina non tradotta)
#   locale  og:locale delle pagine generate in questa lingua
it:
  flag: it
  name: Italiano
  read: Leggi in italiano
  home: Italiano (home page)
  locale: it_IT
en:
  flag: gb
  name: English
  read: Read in English
  home: English (home page)
  locale: en
