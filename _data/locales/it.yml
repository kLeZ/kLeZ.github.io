# Stringhe di interfaccia — italiano (lingua di default)
# Lingua (_plugins/i18n.rb): selettore nella navbar, blocco lingue dei post, etichette.
# Per aggiungere una lingua bastano il suo codice in `languages` (_config.yml) e un
# file come questo; i contenuti tradotti vanno in _posts/<lingua>/ e _pages/<lingua>/.
#   flag    bandiera, assets/img/flags/<flag>.svg
#   name    nome della lingua, nella lingua stessa
#   read    testo del link verso la versione in questa lingua, nella lingua stessa
#   home    testo del link alla home di questa lingua (pagina non tradotta)
#   locale  og:locale delle pagine in questa lingua
language:
  flag: it
  name: Italiano
  read: Leggi in italiano
  home: Italiano (home page)
  locale: it_IT
# Nomi delle lingue in italiano, per written_in e feed_lang. Una lingua che manca
# qui compare con il suo nome (language.name del suo file).
language_names:
  it: italiano
  en: inglese
